name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: Lint, Types, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts (tipos de imagens/svg e rotas) é gerado e fica no .gitignore.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:coverage -- --ci

      - name: Upload Jest coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          # Banco inexistente: as queries falham rápido e o PrefetchBoundary
          # renderiza a versão padrão (valida também o modo "banco fora do ar").
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci

  # Deploy só em push (nunca em PR), depois da CI passar.
  # develop → environment "preview" | main → environment "production".
  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: preview

    steps:
      - name: Trigger Vercel deploy hook (preview)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEV_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret DEV_DEPLOY_HOOK_URL não configurado no environment preview."
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST "$DEPLOY_HOOK_URL"

  deploy-production:
    name: Deploy Production (Vercel)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://portfolio-lucasfidelis.vercel.app

    steps:
      - name: Trigger Vercel deploy hook (production)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PROD_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret PROD_DEPLOY_HOOK_URL não configurado no environment production."
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST "$DEPLOY_HOOK_URL"